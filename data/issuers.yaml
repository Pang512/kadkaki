# Credit card issuers in Malaysia: KadKaki's coverage checklist (KK-07).
#
# Source: Bank Negara Malaysia (BNM) Financial Sector Participants Directory, category
# "Credit Card Issuer": https://www.bnm.gov.my/regulations/fsp-directory
# Checked: 2026-10-29 (26 issuers, confirmed with the directory's Credit Card Issuers filter).
# Names are as BNM lists them.
#
# batch:         ingestion ticket (A = KK-11, B = KK-12, C = KK-13); "done" = already in sources.yaml
# listing_page:  the bank's own credit card page (official domain only), used as source_page so the
#                weekly check spots new or removed PDF links. "TODO" = still to find.
# pds_found:     PDS links spotted during research. NOT yet verified: check them in the batch ticket.
# Comparison sites are never listed here.

issuers:
  # ---------- Batch A: largest local banks (KK-11) ----------
  - name: Malayan Banking Berhad
    brand: Maybank
    type: bank
    batch: A
    in_sources: [maybank_cashback_platinum]
    listing_page: https://www.maybank2u.com.my/maybank2u/malaysia/en/personal/cards/cc_apply_listing.page
  - name: Maybank Islamic Berhad
    brand: Maybank Islamic
    type: islamic_bank
    batch: A
    in_sources: [maybank_islamic_nadi]
    listing_page: https://www.maybank2u.com.my/Islamic/en/personal/cards.page
    notes: "Nadi Mastercard Credit Card-i is reported as Maybank's basic credit card (fixed 14%)."
  - name: CIMB Bank Berhad
    brand: CIMB
    type: bank
    batch: A
    in_sources: [cimb_credit_cards]
    listing_page: https://www.cimb.com.my/en/personal/day-to-day-banking/cards/credit-card.html?filter=credit-cards
    notes: "CIMB PDS in sources is dated 24 Aug 2024: look for a newer one."
  - name: CIMB Islamic Bank Berhad
    brand: CIMB Islamic
    type: islamic_bank
    batch: A
    listing_page: https://www.cimb.com.my/en/personal/islamic-banking/islamic-banking-overview.html#credit-card
    notes: "CIMB Lite-i Credit Card reported as its basic credit card (fixed 14%). Listing page is the Islamic overview; a cards-only page would be better if one exists."
  - name: Public Bank Berhad
    brand: Public Bank
    type: bank
    batch: A
    in_sources: [pbb_credit_cards]
    listing_page: https://pbebank.com/en/cards/our-cards/
    notes: "sources.yaml still points pbb_credit_cards at the PB Quantum page; switch it in KK-11."
  - name: Public Islamic Bank Berhad
    brand: Public Islamic
    type: islamic_bank
    batch: A
    listing_page: https://www.publicislamicbank.com.my/personal-banking/credit-card-i/our-cards/
  - name: RHB Bank Berhad
    brand: RHB
    type: bank
    batch: A
    listing_page: https://www.rhbgroup.com/personal/cards/credit-cards/overview/index.html
  - name: RHB Islamic Bank Berhad
    brand: RHB Islamic
    type: islamic_bank
    batch: A
    listing_page: https://www.rhbgroup.com/personal/cards/credit-cards/overview/index.html
    notes: "Sinar Credit Card-i reported as RHB's basic credit card. Shares RHB's cards page."
  - name: Hong Leong Bank Berhad
    brand: Hong Leong Bank
    type: bank
    batch: A
    in_sources: [hlb_credit_cards_en, hlb_credit_cards_bm]
    listing_page: https://www.hlb.com.my/en/personal-banking/help-support/product-faq/credit-card.html
    notes: "The FAQ page links the current PDS (checked 2026-10-29), so it works as the source_page."
  - name: AmBank (M) Berhad
    brand: AmBank
    type: bank
    batch: A
    listing_page: https://www.ambank.com.my/cards/credit-cards
    pds_found: [https://www.ambank.com.my/docs/ambankretaillibraries/product-disclosure-sheet/ambankandislamicpdscreditcards.pdf]
    notes: "The PDS found covers AmBank and AmBank Islamic cards in one document."

