# KadKaki source registry (version 2).
# PDFs are NOT stored in the repo. Run: python src/download.py
# Validate this file after every edit: python src/sources.py
# Personal, non-commercial project. Documents remain the property of the banks.
#
# Fields per document
#   doc_id            lowercase_with_underscores, unique
#   bank, product     as shown to users
#   card_type         conventional | islamic (islamic needs shariah_concept)
#   scope             single_card | multi_card
#   language          en | ms
#   valid_as_at       "unknown", YYYY, YYYY-MM or YYYY-MM-DD (date printed on the document)
#   url               direct link to the file, or "" for manual download (then source_page is required)
#   source_page       bank page where the file is linked (optional when url is set)
#   tier              1 = PDS (regulated: fees, rates, eligibility)
#                     2 = bank product page or rewards T&Cs (perks, caps, offers)
#                     Comparison sites and news are never listed here; they are never cited.
#   doc_type          pds | product_page | rewards_tnc (tier 1 must be pds)
#   expected_version  the version label printed inside the document, e.g. "CC PDS ENG V OCT 2026";
#                     null until someone reads it from the file
#   last_checked      YYYY-MM-DD when the live file was last confirmed, or null
#   notes             optional free text

